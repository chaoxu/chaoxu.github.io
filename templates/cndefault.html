<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="艺术画廊守护者">
    <meta name="author" content="许超">
    <meta name="google-site-verification" content="YE2oeW4OwVOPdVVfdpYIakOuD0A2Qo80W_sUbMJDGok">
    <meta property="og:title" content="$htmltitle$">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="艺术画廊守护者">
    <meta property="article:tag" content="$tags$">
    <title>$htmltitle$ — 许超</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/essay.css">
    <link rel="stylesheet" href="/css/site-blog.css">
    <script src="/files/js/essay.js"></script>
    <link rel="alternate" type="application/rss+xml" title="RSS" href="https://chaoxu.prof/cnrss.xml">
  </head>
  <body class="pf-essay">
    <header class="pf-essay-topnav hide-on-print">
      <a class="pf-essay-brand" href="/">chaoxu.prof</a>
      <nav class="pf-essay-navlinks" aria-label="Primary">
        <a href="/">关于</a>
        <a href="/blog.html" lang="en">English Blog</a>
        <a href="/cnblog.html">中文博客</a>
        <a href="/pages/tools.html" lang="en">Tools</a>
        <a href="/files/cv.pdf" lang="en">CV</a>
        <button class="pf-essay-theme-btn" type="button" data-pf-theme-toggle data-pf-theme-short>☾ Dark</button>
      </nav>
    </header>

    <main class="pf-essay-shell">
      <article>
        <header class="pf-essay-masthead">
          <div class="pf-essay-kicker">艺术画廊守护者</div>
          <h1 class="pf-essay-title" id="article-title">$richtitle$</h1>
          $if(subtitle)$
          <p class="pf-essay-subtitle">$subtitle$</p>
          $endif$
          $if(date)$
          <div class="pf-essay-byline">
            <a href="/">许超</a>
            <time datetime="$date$">$date$</time>
          </div>
          $endif$
        </header>

        <div class="pf-essay-grid">
          <aside class="pf-essay-toc hide-on-print" aria-label="目录"></aside>

          <div class="pf-essay-prose">
            $body$

            <footer class="pf-essay-footer hide-on-print">
              <span>© 2010–2026 <a href="/" rel="author">许超</a> · <a rel="license" href="https://creativecommons.org/licenses/by/4.0/deed.zh">CC BY 4.0</a></span>
              <span><a href="/cnblog.html">全部文章</a> · <a href="/cnrss.xml">RSS</a></span>
            </footer>
          </div>

          <aside class="pf-essay-sidenotes hide-on-print" aria-label="旁注"></aside>
        </div>
      </article>
    </main>

    $if(diagram)$
    <script type="module" src="$diagram$"></script>
    $endif$
  </body>
</html>
