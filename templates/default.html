<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Art Gallery Guardian">
    <meta name="author" content="Chao Xu">
    <meta name="google-site-verification" content="YE2oeW4OwVOPdVVfdpYIakOuD0A2Qo80W_sUbMJDGok">
    <meta property="og:title" content="$htmltitle$">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="The Art Gallery Guardian">
    <meta property="article:tag" content="$tags$">
    <title>$htmltitle$ — Chao Xu</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script src="/docmath.js"></script>

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/essay.css">
    <link rel="stylesheet" href="/css/blog.css">
    <script src="/files/js/essay.js"></script>
    <link rel="alternate" type="application/rss+xml" title="RSS" href="https://chaoxu.prof/rss.xml">
  </head>
  <body class="pf-essay">
    <header class="pf-essay-topnav hide-on-print">
      <a class="pf-essay-brand" href="/">chaoxu.prof</a>
      <nav class="pf-essay-navlinks" aria-label="Primary">
        <a href="/">About</a>
        <a href="/blog.html">Blog</a>
        <a href="/cnblog.html" lang="zh-CN">中文博客</a>
        <a href="/pages/tools.html">Tools</a>
        <a href="/files/cv.pdf">CV</a>
        <button class="pf-essay-theme-btn" type="button" data-pf-theme-toggle data-pf-theme-short>☾ Dark</button>
      </nav>
    </header>

    <main class="pf-essay-shell">
      <article>
        <header class="pf-essay-masthead">
          <div class="pf-essay-kicker">The Art Gallery Guardian</div>
          <h1 class="pf-essay-title" id="article-title">$richtitle$</h1>
          $if(subtitle)$
          <p class="pf-essay-subtitle">$subtitle$</p>
          $endif$
          $if(date)$
          <div class="pf-essay-byline">
            <a href="/">Chao Xu</a>
            <time datetime="$date$">$date$</time>
          </div>
          $endif$
        </header>

        $if(hero_demo)$
        <figure class="pf-essay-hero pf-diagram">
          <canvas data-demo="$hero_demo$" style="height:210px" role="img" aria-label="$htmltitle$"></canvas>
          $if(hero_caption)$
          <figcaption>
            <span>$hero_caption$</span>
            <button class="pf-diagram-ctrl" type="button" data-diagram-toggle>❚❚ Pause</button>
          </figcaption>
          $endif$
        </figure>
        $endif$

        <div class="pf-essay-grid">
          <aside class="pf-essay-toc hide-on-print" aria-label="Table of contents"></aside>

          <div class="pf-essay-prose">
            $body$

            <footer class="pf-essay-footer hide-on-print">
              <span>© 2010–2026 <a href="/" rel="author">Chao Xu</a> · <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></span>
              <span><a href="/blog.html">All Posts</a> · <a href="/rss.xml">RSS</a></span>
            </footer>
          </div>

          <aside class="pf-essay-sidenotes hide-on-print" aria-label="Margin notes"></aside>
        </div>
      </article>
    </main>

    $if(diagram)$
    <script type="module" src="$diagram$"></script>
    $endif$
  </body>
</html>
